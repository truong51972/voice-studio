name: CUDA lock refresh (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/models-overview-stt-cuda'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
      - name: Re-resolve CPU and CUDA dependency graph
        run: uv lock
      - name: Commit the CUDA lockfile to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: refresh uv.lock for CUDA Torch 2.8"
          git push origin HEAD:feat/models-overview-stt-cuda
