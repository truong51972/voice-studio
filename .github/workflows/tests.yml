name: Desktop tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      - name: Install Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libpulse0 ffmpeg
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run python -m voice_studio.diagnostics --check-runtimes
      - run: uv run poe check
      - run: uv run poe test
      - name: Capture project-first editor UI preview
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          mkdir -p artifacts
          uv run python -c "from voice_studio.ui import create_application, build_app; app=create_application([]); window=build_app(); window.show(); app.processEvents(); image=window.grab(); assert not image.isNull(); assert image.save('artifacts/editor-after.png'); window.close(); app.processEvents()"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: voice-studio-editor-preview
          path: artifacts/editor-after.png
          if-no-files-found: error
