name: Desktop tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libpulse0
      - run: uv sync --dev
      - run: uv run poe check
      - run: uv run poe test
