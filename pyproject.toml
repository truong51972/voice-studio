[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voice-studio"
version = "0.1.0"
description = "Local-first desktop audio/video workspace with known-speaker localization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "imageio-ffmpeg>=0.5,<1",
  "numpy>=1.26,<3",
  "plotly>=5.24,<7",
  "poethepoet>=0.35,<1",
  "PySide6>=6.8,<7",
  "scipy>=1.13,<2",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.1,<2", "huggingface-hub>=0.26,<2"]
diarization = ["pyannote.audio>=4,<5; sys_platform != 'darwin' or platform_machine != 'x86_64'"]

[project.scripts]
voice-studio = "voice_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_studio"]

[tool.uv]
package = true
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.14,<7",
]

[tool.poe.tasks]
models = "python scripts/download_models.py"
desktop = "voice-studio"
start = "voice-studio"
test = "pytest -q"
check = "python -m compileall -q src scripts tests"
build = "python scripts/build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
